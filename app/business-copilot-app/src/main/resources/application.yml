spring:
  application:
    name: spring-ai-business-copilot
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        base-url: ${SPRING_AI_OPENAI_CHAT_BASE_URL:${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}}
        api-key: ${SPRING_AI_OPENAI_CHAT_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
        timeout: ${SPRING_AI_OPENAI_CHAT_TIMEOUT:45s}
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:deepseek-v4-flash}
      embedding:
        base-url: ${SPRING_AI_OPENAI_EMBEDDING_BASE_URL:https://api.openai.com}
        api-key: ${SPRING_AI_OPENAI_EMBEDDING_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
        model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        timeout: ${SPRING_AI_OPENAI_EMBEDDING_TIMEOUT:30s}
    # 只重试瞬时网络或服务端故障；客户端错误默认不重试，避免无效调用和成本放大。
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:3}
      on-client-errors: false
      backoff:
        initial-interval: ${SPRING_AI_RETRY_INITIAL_INTERVAL:500ms}
        max-interval: ${SPRING_AI_RETRY_MAX_INTERVAL:2s}
        multiplier: 2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/business_copilot}
    username: ${SPRING_DATASOURCE_USERNAME:copilot}
    password: ${SPRING_DATASOURCE_PASSWORD:copilot}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    # 业务日志统一携带 HTTP 请求、操作者和 AI 子调用编号，后台任务使用明确兜底标识。
    level: "%5p [requestId=%X{requestId:-background} actorId=%X{actorId:-system} aiCallId=%X{aiCallId:-none} aiOperation=%X{aiOperation:-none}]"

# ── Data Copilot 配置 ──────────────────────────────────────────
business-copilot:
  audit:
    retention:
      anonymize-after: ${BUSINESS_COPILOT_AUDIT_ANONYMIZE_AFTER:7d}
      delete-after: ${BUSINESS_COPILOT_AUDIT_DELETE_AFTER:30d}
      cleanup-cron: ${BUSINESS_COPILOT_AUDIT_CLEANUP_CRON:0 15 3 * * *}
  security:
    admin:
      username: ${BUSINESS_COPILOT_ADMIN_USERNAME:admin}
      password: ${BUSINESS_COPILOT_ADMIN_PASSWORD:admin-change-me}
    operator:
      username: ${BUSINESS_COPILOT_OPERATOR_USERNAME:operator}
      password: ${BUSINESS_COPILOT_OPERATOR_PASSWORD:operator-change-me}
    reviewer:
      username: ${BUSINESS_COPILOT_REVIEWER_USERNAME:reviewer}
      password: ${BUSINESS_COPILOT_REVIEWER_PASSWORD:reviewer-change-me}
  data-copilot:
    datasource:
      enabled: ${BUSINESS_QUERY_DATASOURCE_ENABLED:false}
      url: ${BUSINESS_QUERY_DATASOURCE_URL:}
      username: ${BUSINESS_QUERY_DATASOURCE_USERNAME:}
      password: ${BUSINESS_QUERY_DATASOURCE_PASSWORD:}
      dialect: ${BUSINESS_QUERY_DATASOURCE_DIALECT:auto}
      driver-class-name: ${BUSINESS_QUERY_DATASOURCE_DRIVER:}
      maximum-pool-size: ${BUSINESS_QUERY_DATASOURCE_MAX_POOL_SIZE:5}
      connection-timeout-ms: ${BUSINESS_QUERY_DATASOURCE_CONNECTION_TIMEOUT_MS:5000}
    schema:
      queryable-tables:
        - public.customers
        - public.products
        - public.orders
        - public.order_items
        - public.refunds
        - public.marketing_events
      # query_audit_logs 不在白名单中，自然语言查询无法触达
      max-schema-text-length: 2000
    confirmation:
      candidate-ttl-minutes: 10
    query:
      query-timeout-seconds: 30
      max-rows: 100
      fetch-size: 50
      max-columns: 50
      max-result-bytes: 1048576
  guardrails:
    queryable-columns:
      - public.customers.id
      - public.customers.name
      - public.customers.email
      - public.customers.phone
      - public.customers.created_at
      - public.products.id
      - public.products.name
      - public.products.category
      - public.products.price
      - public.products.stock
      - public.products.created_at
      - public.orders.id
      - public.orders.customer_id
      - public.orders.status
      - public.orders.total_amount
      - public.orders.created_at
      - public.order_items.id
      - public.order_items.order_id
      - public.order_items.product_id
      - public.order_items.quantity
      - public.order_items.unit_price
      - public.order_items.subtotal
      - public.refunds.id
      - public.refunds.order_id
      - public.refunds.amount
      - public.refunds.status
      - public.refunds.created_at
      - public.marketing_events.id
      - public.marketing_events.name
      - public.marketing_events.channel
      - public.marketing_events.start_date
      - public.marketing_events.end_date
      - public.marketing_events.budget
    default-max-rows: 100
    require-limit: true
    allowed-aggregate-functions:
      - count
      - sum
      - avg
      - min
      - max
  ai-core:
    model-name: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:deepseek-v4-flash}
    provider-name: ${BUSINESS_COPILOT_AI_PROVIDER:openai-compatible}
    resilience:
      max-concurrent-calls: ${BUSINESS_COPILOT_AI_MAX_CONCURRENT_CALLS:8}
      acquire-timeout: ${BUSINESS_COPILOT_AI_ACQUIRE_TIMEOUT:2s}
      sliding-window-size: ${BUSINESS_COPILOT_AI_CIRCUIT_WINDOW_SIZE:10}
      minimum-number-of-calls: ${BUSINESS_COPILOT_AI_CIRCUIT_MIN_CALLS:5}
      failure-rate-threshold: ${BUSINESS_COPILOT_AI_CIRCUIT_FAILURE_RATE:50}
      open-state-duration: ${BUSINESS_COPILOT_AI_CIRCUIT_OPEN_DURATION:30s}
  # ── Knowledge Copilot 配置 ─────────────────────────────────────
  # embedding-dimension 必须与模型实际输出维度一致。V17 已将数据库列改为可变维度，
  # 切换模型时不再修改历史迁移；已有文档需要在界面点击“重建索引”。
  knowledge:
    enabled: true
    max-document-size: 2097152
    top-k: 5
    min-similarity: 0.70
    embedding-model-name: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: ${SPRING_AI_OPENAI_EMBEDDING_DIMENSION:1536}
    index-worker-delay: 3000
    chunking:
      chunk-size: 800
      chunk-overlap: 100
  document-processing:
    max-file-bytes: 2097152
    max-extracted-characters: 100000
    max-pdf-pages: 100
  # ── Support Copilot 配置 ─────────────────────────────────────
  # 智能客服助手。工单输入入库前脱敏，回复草稿生成后需人工确认。
  # high-risk-categories 中的分类默认标记 needsHuman=true。
  support-copilot:
    enabled: true
    max-ticket-length: 2000
    draft-ttl-minutes: 10
    high-risk-categories: REFUND,ACCOUNT_SECURITY,INCIDENT
    auto-human-handoff-enabled: true
    knowledge-top-k: 5
  # ── Report Copilot 配置 ──────────────────────────────────────
  # 报表草稿必须人工确认；只有 CONFIRMED 状态可导出 Markdown。
  report-copilot:
    enabled: true
    max-period-days: 31
    max-source-count: 50
    max-source-length: 4000
    max-metric-sources: 20
    max-task-sources: 20
    max-meeting-note-sources: 10
    draft-ttl: 30m
    allowed-report-types: TEAM_WEEKLY,BUSINESS_WEEKLY,PROJECT_STATUS
    markdown-export-enabled: true
    html-export-enabled: true
    max-import-bytes: 1048576
    source-freshness-ttl: 7d
    default-template-id: evidence-weekly
    default-template-version: "2.0"
  # ── Resume Copilot 配置 ──────────────────────────────────────
  # 仅做单 JD、单简历的证据化辅助评估，不输出分数、排名或招聘决定。
  resume-copilot:
    enabled: true
    max-job-description-length: 12000
    max-resume-length: 20000
    max-criteria-count: 30
    max-evidence-count: 80
    review-token-ttl: 30m
    protected-attribute-guard-enabled: true
    submission-retention: 30d
    retention-cleanup-delay: 1h
    max-reviewer-feedback-length: 4000
