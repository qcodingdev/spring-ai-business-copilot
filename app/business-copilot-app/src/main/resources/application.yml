spring:
  application:
    name: spring-ai-business-copilot
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        base-url: ${SPRING_AI_OPENAI_CHAT_BASE_URL:${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}}
        api-key: ${SPRING_AI_OPENAI_CHAT_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:deepseek-v4-flash}
      embedding:
        base-url: ${SPRING_AI_OPENAI_EMBEDDING_BASE_URL:https://api.openai.com}
        api-key: ${SPRING_AI_OPENAI_EMBEDDING_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
        model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/business_copilot}
    username: ${SPRING_DATASOURCE_USERNAME:copilot}
    password: ${SPRING_DATASOURCE_PASSWORD:copilot}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ── Data Copilot 配置 ──────────────────────────────────────────
business-copilot:
  security:
    admin:
      username: ${BUSINESS_COPILOT_ADMIN_USERNAME:admin}
      password: ${BUSINESS_COPILOT_ADMIN_PASSWORD:admin-change-me}
    operator:
      username: ${BUSINESS_COPILOT_OPERATOR_USERNAME:operator}
      password: ${BUSINESS_COPILOT_OPERATOR_PASSWORD:operator-change-me}
    reviewer:
      username: ${BUSINESS_COPILOT_REVIEWER_USERNAME:reviewer}
      password: ${BUSINESS_COPILOT_REVIEWER_PASSWORD:reviewer-change-me}
  data-copilot:
    datasource:
      enabled: ${BUSINESS_QUERY_DATASOURCE_ENABLED:false}
      url: ${BUSINESS_QUERY_DATASOURCE_URL:}
      username: ${BUSINESS_QUERY_DATASOURCE_USERNAME:}
      password: ${BUSINESS_QUERY_DATASOURCE_PASSWORD:}
      driver-class-name: ${BUSINESS_QUERY_DATASOURCE_DRIVER:org.postgresql.Driver}
      maximum-pool-size: ${BUSINESS_QUERY_DATASOURCE_MAX_POOL_SIZE:5}
    schema:
      queryable-tables:
        - public.customers
        - public.products
        - public.orders
        - public.order_items
        - public.refunds
        - public.marketing_events
      # query_audit_logs 不在白名单中，自然语言查询无法触达
      max-schema-text-length: 2000
    confirmation:
      candidate-ttl-minutes: 10
    query:
      query-timeout-seconds: 30
      max-rows: 100
      fetch-size: 50
      max-columns: 50
      max-result-bytes: 1048576
  guardrails:
    default-max-rows: 100
    require-limit: true
    allowed-aggregate-functions:
      - count
      - sum
      - avg
      - min
      - max
  ai-core:
    model-name: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:deepseek-v4-flash}
  # ── Knowledge Copilot 配置 ─────────────────────────────────────
  # embedding-dimension 必须与 V4 迁移中 knowledge_chunk_embeddings.embedding 列维度
  # 以及实际 embedding 模型输出维度一致，否则向量写入或检索会失败。
  knowledge:
    enabled: true
    max-document-size: 2097152
    top-k: 5
    min-similarity: 0.70
    embedding-model-name: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimension: 1536
    chunking:
      chunk-size: 800
      chunk-overlap: 100
  # ── Support Copilot 配置 ─────────────────────────────────────
  # 智能客服助手。工单输入入库前脱敏，回复草稿生成后需人工确认。
  # high-risk-categories 中的分类默认标记 needsHuman=true。
  support-copilot:
    enabled: true
    max-ticket-length: 2000
    draft-ttl-minutes: 10
    high-risk-categories: REFUND,ACCOUNT_SECURITY,INCIDENT
    auto-human-handoff-enabled: true
    knowledge-top-k: 5
  # ── Report Copilot 配置 ──────────────────────────────────────
  # 报表草稿必须人工确认；只有 CONFIRMED 状态可导出 Markdown。
  report-copilot:
    enabled: true
    max-period-days: 31
    max-source-count: 50
    max-source-length: 4000
    max-metric-sources: 20
    max-task-sources: 20
    max-meeting-note-sources: 10
    draft-ttl: 30m
    allowed-report-types: TEAM_WEEKLY,BUSINESS_WEEKLY,PROJECT_STATUS
    markdown-export-enabled: true
  # ── Resume Copilot 配置 ──────────────────────────────────────
  # 仅做单 JD、单简历的证据化辅助评估，不输出分数、排名或招聘决定。
  resume-copilot:
    enabled: true
    max-job-description-length: 12000
    max-resume-length: 20000
    max-criteria-count: 30
    max-evidence-count: 80
    review-token-ttl: 30m
    protected-attribute-guard-enabled: true
