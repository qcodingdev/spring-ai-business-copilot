# PostgreSQL 16 + pgvector + Spring AI Business Copilot 一键启动。
# 用法：
#   cd examples && cp .env.example .env   # 按需填写 API Key
#   docker compose up --build
# 启动后访问 http://localhost:8080 ，Flyway 自动初始化示例业务库和五个 Copilot 的相关表。
#
# 仅启动 PostgreSQL（不要应用）：
#   docker compose up postgres

services:
  postgres:
    # pgvector 官方镜像，内置 pgvector 扩展，无需手动安装。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      BUSINESS_READER_USERNAME: ${BUSINESS_READER_USERNAME:-business_reader}
      BUSINESS_READER_PASSWORD: ${BUSINESS_READER_PASSWORD:-business-reader-change-me}
    ports:
      # 暴露到宿主机 5432，便于本地工具直连
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - copilot-pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-business_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/business_copilot}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-copilot}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-copilot}
      BUSINESS_COPILOT_ADMIN_USERNAME: ${BUSINESS_COPILOT_ADMIN_USERNAME:-admin}
      BUSINESS_COPILOT_ADMIN_PASSWORD: ${BUSINESS_COPILOT_ADMIN_PASSWORD:-admin-change-me}
      BUSINESS_COPILOT_OPERATOR_USERNAME: ${BUSINESS_COPILOT_OPERATOR_USERNAME:-operator}
      BUSINESS_COPILOT_OPERATOR_PASSWORD: ${BUSINESS_COPILOT_OPERATOR_PASSWORD:-operator-change-me}
      BUSINESS_COPILOT_REVIEWER_USERNAME: ${BUSINESS_COPILOT_REVIEWER_USERNAME:-reviewer}
      BUSINESS_COPILOT_REVIEWER_PASSWORD: ${BUSINESS_COPILOT_REVIEWER_PASSWORD:-reviewer-change-me}
      BUSINESS_QUERY_DATASOURCE_ENABLED: ${BUSINESS_QUERY_DATASOURCE_ENABLED:-true}
      BUSINESS_QUERY_DATASOURCE_URL: ${BUSINESS_QUERY_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/business_copilot}
      BUSINESS_QUERY_DATASOURCE_USERNAME: ${BUSINESS_QUERY_DATASOURCE_USERNAME:-business_reader}
      BUSINESS_QUERY_DATASOURCE_PASSWORD: ${BUSINESS_QUERY_DATASOURCE_PASSWORD:-business-reader-change-me}
      BUSINESS_QUERY_DATASOURCE_DIALECT: ${BUSINESS_QUERY_DATASOURCE_DIALECT:-auto}
      BUSINESS_QUERY_DATASOURCE_DRIVER: ${BUSINESS_QUERY_DATASOURCE_DRIVER:-}
      BUSINESS_QUERY_DATASOURCE_MAX_POOL_SIZE: ${BUSINESS_QUERY_DATASOURCE_MAX_POOL_SIZE:-5}
      # ── 长期公网体验边界 ───────────────────────────────────────
      BUSINESS_COPILOT_PUBLIC_DEMO_CLIENT_DAILY_OPERATIONS: ${BUSINESS_COPILOT_PUBLIC_DEMO_CLIENT_DAILY_OPERATIONS:-20}
      BUSINESS_COPILOT_PUBLIC_DEMO_GLOBAL_DAILY_MODEL_CALLS: ${BUSINESS_COPILOT_PUBLIC_DEMO_GLOBAL_DAILY_MODEL_CALLS:-500}
      BUSINESS_COPILOT_PUBLIC_DEMO_MAX_CONCURRENT_EXECUTIONS: ${BUSINESS_COPILOT_PUBLIC_DEMO_MAX_CONCURRENT_EXECUTIONS:-4}
      BUSINESS_COPILOT_PUBLIC_DEMO_FINGERPRINT_SECRET: ${BUSINESS_COPILOT_PUBLIC_DEMO_FINGERPRINT_SECRET:-development-only-change-me}
      BUSINESS_COPILOT_PUBLIC_DEMO_TIMEZONE: ${BUSINESS_COPILOT_PUBLIC_DEMO_TIMEZONE:-Asia/Shanghai}
      BUSINESS_COPILOT_INPUT_TOKEN_PRICE_PER_MILLION: ${BUSINESS_COPILOT_INPUT_TOKEN_PRICE_PER_MILLION:-}
      BUSINESS_COPILOT_OUTPUT_TOKEN_PRICE_PER_MILLION: ${BUSINESS_COPILOT_OUTPUT_TOKEN_PRICE_PER_MILLION:-}
      # ── Chat Model ──────────────────────────────────────────────
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://api.deepseek.com}
      SPRING_AI_OPENAI_CHAT_BASE_URL: ${SPRING_AI_OPENAI_CHAT_BASE_URL:-${SPRING_AI_OPENAI_BASE_URL:-https://api.deepseek.com}}
      SPRING_AI_OPENAI_CHAT_API_KEY: ${SPRING_AI_OPENAI_CHAT_API_KEY:-${SPRING_AI_OPENAI_API_KEY:-}}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:-deepseek-v4-flash}
      SPRING_AI_OPENAI_CHAT_TIMEOUT: ${SPRING_AI_OPENAI_CHAT_TIMEOUT:-45s}
      SPRING_AI_RETRY_MAX_ATTEMPTS: ${SPRING_AI_RETRY_MAX_ATTEMPTS:-3}
      SPRING_AI_RETRY_INITIAL_INTERVAL: ${SPRING_AI_RETRY_INITIAL_INTERVAL:-500ms}
      SPRING_AI_RETRY_MAX_INTERVAL: ${SPRING_AI_RETRY_MAX_INTERVAL:-2s}
      BUSINESS_COPILOT_AI_MAX_CONCURRENT_CALLS: ${BUSINESS_COPILOT_AI_MAX_CONCURRENT_CALLS:-8}
      BUSINESS_COPILOT_AI_ACQUIRE_TIMEOUT: ${BUSINESS_COPILOT_AI_ACQUIRE_TIMEOUT:-2s}
      BUSINESS_COPILOT_AI_CIRCUIT_WINDOW_SIZE: ${BUSINESS_COPILOT_AI_CIRCUIT_WINDOW_SIZE:-10}
      BUSINESS_COPILOT_AI_CIRCUIT_MIN_CALLS: ${BUSINESS_COPILOT_AI_CIRCUIT_MIN_CALLS:-5}
      BUSINESS_COPILOT_AI_CIRCUIT_FAILURE_RATE: ${BUSINESS_COPILOT_AI_CIRCUIT_FAILURE_RATE:-50}
      BUSINESS_COPILOT_AI_CIRCUIT_OPEN_DURATION: ${BUSINESS_COPILOT_AI_CIRCUIT_OPEN_DURATION:-30s}
      # ── Embedding Model ─────────────────────────────────────────
      # Knowledge Copilot 依赖 embedding 模型进行文档向量化和检索。
      # 使用 OpenAI 兼容的 embedding 模型（如 text-embedding-3-small）。
      SPRING_AI_MODEL_EMBEDDING: ${SPRING_AI_MODEL_EMBEDDING:-none}
      SPRING_AI_OPENAI_EMBEDDING_BASE_URL: ${SPRING_AI_OPENAI_EMBEDDING_BASE_URL:-https://api.openai.com}
      SPRING_AI_OPENAI_EMBEDDING_API_KEY: ${SPRING_AI_OPENAI_EMBEDDING_API_KEY:-${SPRING_AI_OPENAI_API_KEY:-}}
      SPRING_AI_OPENAI_EMBEDDING_MODEL: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      SPRING_AI_OPENAI_EMBEDDING_DIMENSION: ${SPRING_AI_OPENAI_EMBEDDING_DIMENSION:-1536}
      SPRING_AI_OPENAI_EMBEDDING_TIMEOUT: ${SPRING_AI_OPENAI_EMBEDDING_TIMEOUT:-30s}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    stop_grace_period: 30s

volumes:
  copilot-pg-data:
